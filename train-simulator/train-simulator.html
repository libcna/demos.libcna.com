<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><meta content=#071018 name=theme-color><title>Northern Valley Express</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body,html{width:100%;height:100%;margin:0;overflow:hidden;background:#071018}body{display:grid;place-items:center}#frame{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#000;box-shadow:0 1.5rem 5rem #000b}canvas{display:block;width:100%;height:100%;outline:0;background:#000}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:1rem;padding:2rem;text-align:center;background:#071018;transition:opacity .3s}#loading.done{opacity:0;pointer-events:none}#title{color:#eef7f7;font-size:clamp(1.4rem, 3vw, 2.4rem);letter-spacing:.08em}#status{min-height:1.5em;color:#a9c1c9}progress{width:min(26rem,70vw);height:.55rem;accent-color:#d5aa42}#fullscreen{position:absolute;right:.8rem;bottom:.8rem;border:1px solid #ffffff55;border-radius:.35rem;padding:.55rem .75rem;color:#fff;background:#071018bb;cursor:pointer;opacity:.65}#fullscreen:focus-visible,#fullscreen:hover{opacity:1}@media (max-aspect-ratio:16 / 9){#frame{width:100vw;height:auto}}@media (min-aspect-ratio:16 / 9){#frame{width:auto;height:100vh}}</style></head><body><main id=frame><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas><section aria-live=polite id=loading><div id=title>NORTHERN VALLEY EXPRESS</div><progress id=progress max=100 value=0></progress><div id=status>Loading simulator…</div></section><button id=fullscreen title="Toggle fullscreen"type=button>Fullscreen</button></main><script>const canvas=document.getElementById("canvas"),loading=document.getElementById("loading"),status=document.getElementById("status"),progress=document.getElementById("progress");let totalDependencies=0;var Module={canvas:canvas,printErr:e=>console.error(e),setStatus(e){if(!e)return loading.classList.add("done"),void canvas.focus();const t=e.match(/([\d.]+)\/([\d.]+)/);status.textContent=e,t&&(progress.max=100*Number(t[2]),progress.value=100*Number(t[1]))},monitorRunDependencies(e){totalDependencies=Math.max(totalDependencies,e),Module.setStatus(e?`Loading data (${totalDependencies-e}/${totalDependencies})`:"Starting…")},onAbort(e){loading.classList.remove("done"),status.textContent=`Could not start: ${e}`}};window.addEventListener("error",(e=>Module.onAbort(e.message))),document.getElementById("fullscreen").addEventListener("click",(async()=>{document.fullscreenElement?await document.exitFullscreen():await document.getElementById("frame").requestFullscreen(),canvas.focus()}))</script><script async src=train-simulator.js></script></body></html>
