<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><title>island-simulator</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body,html{width:100%;height:100%;margin:0;overflow:hidden;background:#102a31}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:min(100vw,177.777778vh);height:min(100vh,56.25vw);background:#152a32;outline:0}#instructions{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(90vw,680px);padding:10px 14px;border:1px solid rgba(158,235,207,.55);border-radius:8px;background:rgba(4,20,22,.86);color:#e8f6ee;text-align:center;font-size:14px;pointer-events:none}#instructions strong{color:#79eec3}#status{display:block;margin-top:4px;color:#b8ccc5;font-size:12px}</style></head><body><canvas height=720 id=canvas tabindex=0 width=1280></canvas><div id=instructions><strong>Click the island to look around</strong> · WASD / arrows move · Shift toggles walk/run on ground · Tab flight (Space up, Shift down) · B camera motion · F11 fullscreen · F1 diagnostics · F2 world view · M mute · Escape releases the mouse <span id=status>Loading island-simulator…</span></div><script>const canvas=document.getElementById("canvas"),instructions=document.getElementById("instructions"),status=document.getElementById("status");globalThis.islandDeploymentOutput="";const record=(t,n)=>{const e=n.join(" ");globalThis.islandDeploymentOutput+=e+"\n",t(...n)};var Module={canvas:canvas,print:(...t)=>record(console.log,t),printErr:(...t)=>record(console.error,t),onRuntimeInitialized:()=>{status.textContent="Ready"},onAbort:t=>{status.textContent=`Unable to start: ${t}`}};canvas.addEventListener("mousedown",(t=>{if(canvas.focus(),0===t.button&&document.pointerLockElement!==canvas){const t=canvas.requestPointerLock({unadjustedMovement:!0});t&&"function"==typeof t.catch&&t.catch((()=>canvas.re
